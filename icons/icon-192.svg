<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="188" height="188" rx="40" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Outer Timer Ring -->
  <circle cx="96" cy="100" r="64" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8"/>
  <circle cx="96" cy="100" r="64" fill="none" stroke="url(#ropeGrad)" stroke-width="8" stroke-dasharray="320" stroke-dashoffset="80" stroke-linecap="round"/>

  <!-- Stopwatch Top Button -->
  <rect x="88" y="22" width="16" height="10" rx="3" fill="#9CA3AF"/>
  <rect x="92" y="32" width="8" height="6" fill="#6B7280"/>

  <!-- Jump Rope Arc Dynamic Graphic -->
  <path d="M50 82 C65 145, 127 145, 142 82" fill="none" stroke="url(#glowGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Rope Handles -->
  <rect x="42" y="66" width="12" height="24" rx="4" transform="rotate(-25 48 78)" fill="#F3F4F6"/>
  <rect x="138" y="66" width="12" height="24" rx="4" transform="rotate(25 144 78)" fill="#F3F4F6"/>

  <!-- Center Stopwatch Pulse Icon -->
  <polygon points="90,88 90,112 110,100" fill="#FFFFFF"/>
</svg>
